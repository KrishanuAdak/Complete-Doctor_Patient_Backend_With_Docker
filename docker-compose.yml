services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctor_db
    ports:
      - "3307:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  eureka:
    image: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-network

  doctor-service:
    image: doctor-service
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy   # ← waits until MySQL passes health check
      eureka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctor_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-network
  api-gateway:
    image: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      eureka:
          condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/

    networks:
      - app-network


networks:
  app-network:
    driver: bridge