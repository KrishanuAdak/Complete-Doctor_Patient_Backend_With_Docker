name: Deploy To AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login To ECR
      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build & Push Images
      - name: Build API Gateway
        run: |
          cd Api_Gateway_Microservices
          docker build -t api-gateway .
          docker tag api-gateway:latest ${{ secrets.ECR_REGISTRY }}/api-gateway:latest
          docker push ${{ secrets.ECR_REGISTRY }}/api-gateway:latest

      - name: Build Eureka
        run: |
          cd EurekaServer_Microservice
          docker build -t eureka-service .
          docker tag eureka-service:latest ${{ secrets.ECR_REGISTRY }}/eureka-service:latest
          docker push ${{ secrets.ECR_REGISTRY }}/eureka-service:latest

      - name: Build Patient
        run: |
          cd Patients_Microservices
          docker build -t patient-service .
          docker tag patient-service:latest ${{ secrets.ECR_REGISTRY }}/patient-service:latest
          docker push ${{ secrets.ECR_REGISTRY }}/patient-service:latest

      - name: Build Doctor
        run: |
          cd Doctor_Microservice
          docker build -t doctor-service .
          docker tag doctor-service:latest ${{ secrets.ECR_REGISTRY }}/doctor-service:latest
          docker push ${{ secrets.ECR_REGISTRY }}/doctor-service:latest

      - name: Build Appointment
        run: |
          cd Appointment_Microservices
          docker build -t appointment-service .
          docker tag appointment-service:latest ${{ secrets.ECR_REGISTRY }}/appointment-service:latest
          docker push ${{ secrets.ECR_REGISTRY }}/appointment-service:latest

      - name: Build Auth Service
        run: |
          cd AuthService
          docker build -t auth-service .
          docker tag auth-service:latest ${{ secrets.ECR_REGISTRY }}/auth-service:latest
          docker push ${{ secrets.ECR_REGISTRY }}/auth-service:latest

      # Deploy To EC2
      - name: Deploy EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd appointment-booking-microservices

            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker compose down

            docker pull ${{ secrets.ECR_REGISTRY }}/api-gateway:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/eureka-service:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/patient-service:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/doctor-service:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/appointment-service:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/ai-service:latest

            docker compose up -d