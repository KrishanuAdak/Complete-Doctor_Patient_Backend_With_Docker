name: Deploy To AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Common Security
        run: |
          cd common-security
          mvn clean install -DskipTests

      - name: Build Eureka Server
        run: |
          cd EurekaServer_Microservice
          mvn clean package -DskipTests

      - name: Build Appointment Service
        run: |
          cd Appointment_Microservices
          mvn clean package -DskipTests

      - name: Build Auth Service
        run: |
          cd AuthService
          mvn clean package -DskipTests

      - name: Build API Gateway
        run: |
          cd Api_Gateway_Microservices
          mvn clean package -DskipTests

      - name: Build AI Service
        run: |
          cd ai-service
          mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login To Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Eureka
        run: |
          cd EurekaServer_Microservice
          docker build -t eureka-service .
          docker tag eureka-service:latest $ECR_REGISTRY/eureka-service:latest
          docker push $ECR_REGISTRY/eureka-service:latest

      - name: Build and Push Appointment
        run: |
          cd Appointment_Microservices
          docker build -t appointment-service .
          docker tag appointment-service:latest $ECR_REGISTRY/appointment-service:latest
          docker push $ECR_REGISTRY/appointment-service:latest

      - name: Build and Push Auth
        run: |
          cd AuthService
          docker build -t auth-service .
          docker tag auth-service:latest $ECR_REGISTRY/auth-service:latest
          docker push $ECR_REGISTRY/auth-service:latest

      - name: Build and Push API Gateway
        run: |
          cd Api_Gateway_Microservices
          docker build -t api-gateway .
          docker tag api-gateway:latest $ECR_REGISTRY/api-gateway:latest
          docker push $ECR_REGISTRY/api-gateway:latest

      - name: Build and Push AI Service
        run: |
          cd ai-service
          docker build -t ai-service .
          docker tag ai-service:latest $ECR_REGISTRY/ai-service:latest
          docker push $ECR_REGISTRY/ai-service:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: ${{ secrets.REPO_URL }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_REGION: ap-south-2
          DOCKER_DB_NAME: ${{ secrets.DOCKER_DB_NAME }}
          DOCKER_DB_USERNAME: ${{ secrets.DOCKER_DB_USERNAME }}
          DOCKER_DB_PASSWORD: ${{ secrets.DOCKER_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: REPO_URL,ECR_REGISTRY,AWS_REGION,DOCKER_DB_NAME,DOCKER_DB_USERNAME,DOCKER_DB_PASSWORD,OPENAI_API_KEY

          script: |
            set -e

            echo "===== DEPLOYMENT STARTED ====="

            if [ ! -d "appointment-booking-microservices" ]; then
              git clone "$REPO_URL" appointment-booking-microservices
            fi

            cd appointment-booking-microservices

            git fetch origin
            git reset --hard origin/main

            printf "ECR_URL=%s\nDOCKER_DB_NAME=%s\nDOCKER_DB_USERNAME=%s\nDOCKER_DB_PASSWORD=%s\nOPENAI_API_KEY=%s\n" \
            "$ECR_REGISTRY" \
            "$DOCKER_DB_NAME" \
            "$DOCKER_DB_USERNAME" \
            "$DOCKER_DB_PASSWORD" \
            "$OPENAI_API_KEY" > .env

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "===== DISK USAGE BEFORE CLEANUP ====="
            df -h /
            docker system df

            echo "===== PULLING NEW IMAGES ====="
            docker compose pull

            echo "===== RESTARTING CONTAINERS ====="
            docker compose down
            docker compose up -d

            sleep 60

            docker compose ps

            echo "===== CLEANING UP OLD IMAGES AND SPACE ====="
            # Only prune now that the new stack is confirmed up, so a failed
            # pull never leaves this box with zero usable images.
            docker image prune -af
            docker container prune -f
            docker builder prune -af
            docker volume prune -f
            docker network prune -f

            echo "===== DISK USAGE AFTER CLEANUP ====="
            df -h /
            docker system df

            echo "===== DEPLOYMENT COMPLETED ====="

      - name: Verify Deployment
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            docker ps
            cd appointment-booking-microservices
            docker compose ps