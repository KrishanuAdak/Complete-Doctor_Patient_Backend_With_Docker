<!doctype html>
<html>
  <head>
    <title>WebRTC Demo</title>
  </head>
  <body>
    <h2>WebRTC Video Call</h2>

    <video id="localVideo" autoplay playsinline width="300"></video>
    <video id="remoteVideo" autoplay playsinline width="300"></video>

    <br /><br />

    <button onclick="startCall()">Start Call</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
      let stompClient;
      let pc;

      // ✅ FIX 1: Use FULL backend URL (port 9000)
      function connectSocket() {
  return new Promise((resolve, reject) => {
    const socket = new SockJS("http://localhost:5959/ws");
    stompClient = Stomp.over(socket);

    stompClient.connect(
      {},
      function () {
        console.log("✅ Connected to WebSocket");

        // Receive OFFER
        stompClient.subscribe("/topic/offer", async (msg) => {
          console.log("📩 Offer received");

          const offer = JSON.parse(msg.body);

          if (!pc) return;

          if (pc.signalingState !== "stable") return;

          await pc.setRemoteDescription(new RTCSessionDescription(offer));

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          stompClient.send("/app/answer", {}, JSON.stringify(answer));
        });

        // Receive ANSWER
        stompClient.subscribe("/topic/answer", async (msg) => {
          console.log("📩 Answer received");

          const answer = JSON.parse(msg.body);

          if (!pc) return;

          if (!pc.currentRemoteDescription) {
            await pc.setRemoteDescription(
              new RTCSessionDescription(answer)
            );
          }
        });

        // Receive ICE
        stompClient.subscribe("/topic/ice", async (msg) => {
          if (!pc) return;

          const candidate = JSON.parse(msg.body);
          if (candidate) {
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
          }
        });

        resolve();
      },
      function (error) {
        console.error("❌ WebSocket Error:", error);
        reject(error);
      }
    );
  });
}
      

     async function startCall() {

  // ✅ Create PeerConnection FIRST
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  });

  // Then connect socket
  await connectSocket();

  const localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true,
  });

  document.getElementById("localVideo").srcObject = localStream;

  localStream.getTracks().forEach((track) =>
    pc.addTrack(track, localStream)
  );

  pc.ontrack = (event) => {
    document.getElementById("remoteVideo").srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      stompClient.send(
        "/app/ice-candidate",
        {},
        JSON.stringify(event.candidate)
      );
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  console.log("📤 Sending offer");

  stompClient.send("/app/offer", {}, JSON.stringify(offer));
}
    </script>
  </body>
</html>
